name: Test

on:
  push:
  pull_request:

jobs:
  go-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Go test
        run: go test ./...

  windows-desktop-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Validate deployment script
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("deploy.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | Format-List | Out-String | Write-Error; exit 1 }

      - name: Build desktop frontend
        working-directory: desktop
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run build

      - name: Build Windows desktop and hook runtime
        shell: pwsh
        run: |
          $env:CGO_ENABLED = "0"
          go build -tags production -o "$env:RUNNER_TEMP\Agent Notify.exe" ./cmd/agent-notify-desktop
          go build -tags production -o "$env:RUNNER_TEMP\agent-notify.exe" ./cmd/agent-notify

  bun-launcher-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        working-directory: bun
        run: bun install --frozen-lockfile

      - name: Bun launcher checks
        working-directory: bun
        run: |
          bun run typecheck
          bun test

  docker-compose-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker Compose configuration
        run: docker compose -f deploy/compose.yaml config --quiet
